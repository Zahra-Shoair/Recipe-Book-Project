<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="images/cook-book (2).png" alt="Icon of a cooking book" />
      <h1>Recipe Book</h1>
      <p>All your recipes in one place</p>
    </header>
    <main>
      <input type="text" placeholder="Search your recipes..." />
      <div class="filters">
        <button id="all">All</button>
        <button id="breakfast">Breakfast</button>
        <button id="lunch">Lunch</button>
        <button id="dinner">Dinner</button>
        <button id="dessert">Dessert</button>
        <button id="snack">Snack</button>
        <button id="favourites">Favourites</button>
      </div>
      <div class="recipes-container">
        <button class="recipe-card">
          <img src="images/recipe (1).png" alt="icon for a plus sign" />
          <p class="recipe-name">Recipe Name</p>
          <span class="attribute" id="duration-span">25 min</span>
          <span id="servings-span" class="attribute">3 servings</span>
          <span id="type-span" class="attribute">Dinner</span>
        </button>
        <button class="add-recipe-btn">
          <img
            src="images/plus (1).png"
            alt="icon for a plus sign"
            width="128px"
          />
          <p>Add New Recipe</p>
        </button>
      </div>
    </main>
    <form class="recipe-form">
      <label for="name">Recipe Name:</label>
      <input type="text" id="name" required />
      <br />
      <label for="ingredients">Ingredients:</label>
      <textarea id="ingredients"></textarea>
      <br />
      <label for="steps">Steps:</label>
      <textarea id="steps"></textarea>
      <br />
      <label for="time" required>Time to prepare:</label>
      <input
        type="number"
        id="time"
        placeholder="Enter the time in minutes"
        required
      />
      <br />
      <label for="servings">Amount of servings</label>
      <input type="number" id="servings" required />
      <br />
      <label for="type">Type: </label>
      <select id="type">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
        <option>Dessert</option>
        <option>Snack</option>
      </select>
      <button type="button" id="cancel-btn">Cancel</button>
      <button type="submit" id="add-btn">Add Recipe</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
